name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest_version" >&2
            exit 1
          fi
          npx vsce package --out "runit-$version.vsix"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" runit-*.vsix \
            --title "Run It $GITHUB_REF_NAME" \
            --generate-notes
