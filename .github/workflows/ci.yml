name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx vsce package --out runit.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: runit-vsix
          path: runit.vsix
